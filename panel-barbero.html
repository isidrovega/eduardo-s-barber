
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Mi panel | EDUARDO'S BARBERSHOP</title>

    <style>
        :root {
            color-scheme: dark;
            font-family: Arial, sans-serif;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #0b0b0b;
            color: #f5f5f5;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
            padding: 22px 6%;
            border-bottom: 1px solid #292929;
            background: #141414;
        }

        header h1 {
            margin: 0;
            font-size: 20px;
            color: #d4ac70;
        }

        main {
            max-width: 1050px;
            margin: 40px auto;
            padding: 0 20px;
        }

        h2 {
            margin-top: 0;
        }

        .subtitle {
            color: #aaa;
            line-height: 1.6;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(
                auto-fit,
                minmax(280px, 1fr)
            );
            gap: 20px;
            margin-top: 30px;
        }

        .card {
            padding: 25px;
            border: 1px solid #333;
            border-radius: 15px;
            background: #171717;
        }

        .card h3 {
            margin-top: 0;
            color: #d4ac70;
        }

        .field {
            margin: 18px 0;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
        }

        input {
            width: 100%;
            padding: 13px;
            border: 1px solid #444;
            border-radius: 8px;
            background: #101010;
            color: white;
            font: inherit;
        }

        button {
            padding: 12px 18px;
            border: 0;
            border-radius: 8px;
            background: #c99f5d;
            color: #111;
            font-weight: 700;
            cursor: pointer;
        }

        button:disabled {
            opacity: .6;
            cursor: wait;
        }

        .logout {
            background: transparent;
            border: 1px solid #c99f5d;
            color: #d4ac70;
        }

        .message {
            min-height: 24px;
            margin-top: 15px;
            color: #ff9c9c;
            line-height: 1.5;
        }

        .message.success {
            color: #8ce5aa;
        }

        .schedule-row {
            display: flex;
            justify-content: space-between;
            gap: 15px;
            padding: 12px 0;
            border-bottom: 1px solid #303030;
        }

        .schedule-row:last-child {
            border-bottom: 0;
        }

        [hidden] {
            display: none !important;
        }

        @media (max-width: 600px) {
            header {
                align-items: flex-start;
                flex-direction: column;
            }
        }


.barber-calendar {
    margin-top: 20px;
    color: #f5f0e6;
}

.calendar-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 18px;
}

.calendar-title {
    margin: 0;
    font-size: 20px;
    text-transform: capitalize;
}

.calendar-nav {
    width: 40px;
    height: 40px;
    border: 1px solid #b99652;
    border-radius: 10px;
    background: #171717;
    color: #d8b66d;
    font-size: 26px;
    cursor: pointer;
}

.calendar-weekdays,
.calendar-grid {
    display: grid;
    grid-template-columns: repeat(7, minmax(0, 1fr));
    gap: 6px;
}

.calendar-weekdays {
    margin-bottom: 8px;
}

.calendar-weekday {
    text-align: center;
    color: #b99652;
    font-size: 12px;
    font-weight: 700;
}

.calendar-blank {
    min-height: 48px;
}

.calendar-date {
    position: relative;
    min-height: 58px;
    padding: 8px 4px;
    border: 1px solid #343434;
    border-radius: 10px;
    background: #1b1b1b;
    color: #f5f0e6;
    font-size: 15px;
    cursor: pointer;
}

.calendar-date:hover {
    border-color: #b99652;
}

.calendar-date.is-today {
    border-color: #b99652;
}

.calendar-date.is-selected {
    background: #b99652;
    color: #111;
    font-weight: 700;
}

.calendar-count {
    display: block;
    width: fit-content;
    min-width: 18px;
    margin: 4px auto 0;
    padding: 1px 4px;
    border-radius: 8px;
    background: #5e4824;
    color: white;
    font-size: 10px;
}

.calendar-day-title {
    margin: 26px 0 14px;
    color: #d8b66d;
    font-size: 18px;
}

.calendar-appointments {
    display: grid;
    gap: 10px;
}

.calendar-appointment {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 10px;
    padding: 14px;
    border: 1px solid #363636;
    border-radius: 10px;
    background: #191919;
}

.calendar-appointment-time {
    color: #d8b66d;
}

.calendar-appointment-name {
    font-weight: 600;
}

.calendar-appointment-details {
    width: 100%;
    color: #aaa;
}

.calendar-empty,
.calendar-message {
    color: #aaa;
    font-size: 14px;
}

@media (max-width: 480px) {
    .calendar-date {
        min-height: 46px;
        font-size: 13px;
    }

    .calendar-weekdays,
    .calendar-grid {
        gap: 3px;
    }
}

.calendar-appointment-actions {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    width: 100%;
    margin-top: 8px;
}

.calendar-action-button {
    padding: 9px 14px;
    border: 1px solid #b99652;
    border-radius: 8px;
    background: #262016;
    color: #e3c383;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
}

.calendar-action-button:hover {
    background: #3b2d17;
}

.calendar-action-danger {
    border-color: #a65353;
    background: #321d1d;
    color: #f1a7a7;
}

.calendar-action-danger:hover {
    background: #4a2525;
}



.appointment-form-grid {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 16px;
    margin-bottom: 18px;
}

#appointmentEditorSection label {
    display: flex;
    flex-direction: column;
    gap: 8px;
    color: #d8b66d;
    font-size: 14px;
    font-weight: 600;
}

#appointmentEditorSection input,
#appointmentEditorSection select,
#appointmentEditorSection textarea {
    width: 100%;
    padding: 12px;
    border: 1px solid #444;
    border-radius: 9px;
    background: #181818;
    color: #fff;
    font: inherit;
    box-sizing: border-box;
}

#appointmentEditorSection textarea {
    resize: vertical;
}

.appointment-form-actions {
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    margin-top: 20px;
}

.appointment-form-actions button {
    padding: 12px 18px;
    border: 1px solid #b99652;
    border-radius: 9px;
    background: #b99652;
    color: #111;
    font-weight: 700;
    cursor: pointer;
}

#resetBarberAppointmentButton {
    background: transparent;
    color: #d8b66d;
}

.appointment-form-actions button:disabled {
    opacity: 0.6;
    cursor: wait;
}

#barberAppointmentMessage {
    min-height: 22px;
    margin-top: 14px;
    color: #d8b66d;
}

@media (max-width: 600px) {
    .appointment-form-grid {
        grid-template-columns: 1fr;
    }
}


    </style>
</head>

<body>
    <header>
        <h1>✂ EDUARDO'S BARBERSHOP</h1>

        <button
            id="logoutButton"
            class="logout"
            type="button"
            hidden
        >
            Cerrar sesión
        </button>
    </header>

    <main>
        <section id="loadingSection">
            <h2>Verificando acceso...</h2>
            <p class="subtitle">
                Estamos comprobando tu cuenta.
            </p>
        </section>

        <section id="panelSection" hidden>
            <h2 id="welcomeTitle">
                Bienvenido
            </h2>

            <p class="subtitle">
                Este es tu panel personal de barbero.
            </p>

            <div class="grid">
                <article class="card">
                    <h3>Mi perfil</h3>
                    <p>
                        <strong>Nombre:</strong>
                        <span id="profileName">—</span>
                    </p>
                    <p>
                        <strong>Correo:</strong>
                        <span id="profileEmail">—</span>
                    </p>
                    <p>
                        <strong>Estado:</strong>
                        <span id="profileStatus">—</span>
                    </p>
                </article>

                <article class="card">
                    <h3>Mi horario</h3>
                    <div id="scheduleList"></div>
                </article>

                <section class="card" aria-labelledby="calendarHeading">
    <h2 id="calendarHeading">Mi calendario de citas</h2>
    <div id="barberCalendar"></div>
</section>

<section class="card" id="appointmentEditorSection">
    <h2 id="appointmentEditorTitle">Agendar cita</h2>

    <form id="barberAppointmentForm">
        <input
            type="hidden"
            id="barberAppointmentId"
        >

        <div class="appointment-form-grid">
            <label>
                Nombre del cliente
                <input
                    id="barberClientName"
                    type="text"
                    maxlength="120"
                    required
                >
            </label>

            <label>
                Teléfono
                <input
                    id="barberClientPhone"
                    type="tel"
                    maxlength="40"
                >
            </label>

            <label>
                Servicio
                <select
                    id="barberServiceId"
                    required
                >
                    <option value="">Selecciona un servicio</option>
                </select>
            </label>

            <label>
                Fecha
                <input
                    id="barberAppointmentDate"
                    type="date"
                    required
                >
            </label>

            <label>
                Hora
                <select
                    id="barberAppointmentTime"
                    required
                >
                    <option value="">Selecciona una hora</option>
                </select>
            </label>

            <label>
                Origen
                <select id="barberAppointmentOrigin">
                    <option value="phone">Teléfono</option>
                    <option value="whatsapp">WhatsApp</option>
                    <option value="instagram">Instagram</option>
                    <option value="facebook">Facebook</option>
                    <option value="walk-in">En persona</option>
                </select>
            </label>
        </div>

        <label>
            Notas
            <textarea
                id="barberAppointmentNotes"
                maxlength="1000"
                rows="3"
            ></textarea>
        </label>

        <div class="appointment-form-actions">
            <button
                type="submit"
                id="saveBarberAppointmentButton"
            >
                Guardar cita
            </button>

            <button
                type="button"
                id="resetBarberAppointmentButton"
            >
                Nueva cita
            </button>
        </div>

        <p
            id="barberAppointmentMessage"
            role="status"
            aria-live="polite"
        ></p>
    </form>
</section>


</section>



                <article class="card">
                    <h3>Cambiar contraseña</h3>

                    <form id="passwordForm">
                        <div class="field">
                            <label for="currentPassword">
                                Contraseña actual
                            </label>
                            <input
                                id="currentPassword"
                                type="password"
                                autocomplete="current-password"
                                required
                            >
                        </div>

                        <div class="field">
                            <label for="newPassword">
                                Nueva contraseña
                            </label>
                            <input
                                id="newPassword"
                                type="password"
                                autocomplete="new-password"
                                minlength="8"
                                required
                            >
                        </div>

                        <div class="field">
                            <label for="confirmPassword">
                                Confirmar nueva contraseña
                            </label>
                            <input
                                id="confirmPassword"
                                type="password"
                                autocomplete="new-password"
                                minlength="8"
                                required
                            >
                        </div>

                        <button
                            id="changePasswordButton"
                            type="submit"
                        >
                            Actualizar contraseña
                        </button>

                        <p
                            id="passwordMessage"
                            class="message"
                            role="status"
                            aria-live="polite"
                        ></p>
                    </form>
                </article>
            </div>
        </section>

        <section id="errorSection" hidden>
            <h2>No se pudo cargar tu perfil</h2>
            <p id="errorMessage" class="subtitle"></p>
            <button id="retryButton" type="button">
                Reintentar
            </button>
        </section>
    </main>

    <script type="module">
        import { auth, db } from "./js/firebase.js";

        import {
            protectPage,
            logout
        } from "./js/auth.js";

        import {
            EmailAuthProvider,
            reauthenticateWithCredential,
            updatePassword
        } from "https://www.gstatic.com/firebasejs/12.4.0/firebase-auth.js";

        import {
            doc,
            getDoc
        } from "https://www.gstatic.com/firebasejs/12.4.0/firebase-firestore.js";

        import { mountBarberCalendar } from "./js/barber-calendar.js";

        import {
    cancelAppointment
} from "./js/appointment-booking.js";

import {
    initializeBarberAppointmentForm
} from "./js/barber-appointment-form.js";

        const loadingSection =
            document.getElementById("loadingSection");

        const panelSection =
            document.getElementById("panelSection");

        const errorSection =
            document.getElementById("errorSection");

        const logoutButton =
            document.getElementById("logoutButton");

        const passwordForm =
            document.getElementById("passwordForm");

        const passwordMessage =
            document.getElementById("passwordMessage");

        const dayNames = {
            monday: "Lunes",
            tuesday: "Martes",
            wednesday: "Miércoles",
            thursday: "Jueves",
            friday: "Viernes",
            saturday: "Sábado",
            sunday: "Domingo"
        };

        function showError(message) {
            loadingSection.hidden = true;
            panelSection.hidden = true;
            errorSection.hidden = false;

            document.getElementById(
                "errorMessage"
            ).textContent = message;
        }

        function renderSchedule(schedule = {}) {
            const container =
                document.getElementById("scheduleList");

            container.replaceChildren();

            for (const [day, label] of Object.entries(dayNames)) {
                const config = schedule[day];

                const row = document.createElement("div");
                row.className = "schedule-row";

                const name = document.createElement("span");
                name.textContent = label;

                const hours = document.createElement("span");

                hours.textContent = config?.enabled
                    ? `${config.start} - ${config.end}`
                    : "Descanso";

                row.append(name, hours);
                container.append(row);
            }
        }

        async function loadPanel() {
            loadingSection.hidden = false;
            panelSection.hidden = true;
            errorSection.hidden = true;

            try {
                const user = await protectPage("barber");

                if (!user) {
                    return;
                }

                const profileSnapshot = await getDoc(
                    doc(db, "users", user.uid)
                );

                if (!profileSnapshot.exists()) {
                    throw new Error(
                        "Tu cuenta no tiene un perfil asignado."
                    );
                }

                const profile = profileSnapshot.data();

                if (
                    profile.role !== "barber" ||
                    profile.active !== true ||
                    !profile.barberId
                ) {
                    throw new Error(
                        "Tu cuenta no tiene acceso activo."
                    );
                }

                const barberSnapshot = await getDoc(
                    doc(db, "barbers", profile.barberId)
                );

                if (!barberSnapshot.exists()) {
                    throw new Error(
                        "No se encontró tu ficha de barbero."
                    );
                }

                const barber = barberSnapshot.data();

                initializeBarberAppointmentForm(barber);

                const calendarContainer =
    document.getElementById("barberCalendar");

if (calendarContainer) {
    mountBarberCalendar(
        calendarContainer,
        profile.barberId
    );
}

                document.getElementById(
                    "welcomeTitle"
                ).textContent = `Bienvenido, ${barber.name || "Barbero"}`;

                document.getElementById(
                    "profileName"
                ).textContent = barber.name || "Sin nombre";

                document.getElementById(
                    "profileEmail"
                ).textContent = user.email || "Sin correo";

                document.getElementById(
                    "profileStatus"
                ).textContent = barber.status === "active"
                    ? "Activo"
                    : "Inactivo";

                renderSchedule(barber.schedule);

                loadingSection.hidden = true;
                panelSection.hidden = false;
                logoutButton.hidden = false;

            } catch (error) {
                console.error(
                    "Error cargando panel de barbero:",
                    error
                );

                showError(
                    "No fue posible consultar tu información. " +
                    "Comprueba tu conexión y tus permisos."
                );
            }
        }

        passwordForm.addEventListener(
            "submit",
            async event => {
                event.preventDefault();

                const user = auth.currentUser;

                if (!user || !user.email) {
                    passwordMessage.textContent =
                        "Debes iniciar sesión nuevamente.";
                    return;
                }

                const currentPassword =
                    document.getElementById(
                        "currentPassword"
                    ).value;

                const newPassword =
                    document.getElementById(
                        "newPassword"
                    ).value;

                const confirmPassword =
                    document.getElementById(
                        "confirmPassword"
                    ).value;

                if (newPassword.length < 8) {
                    passwordMessage.textContent =
                        "Usa al menos 8 caracteres.";
                    return;
                }

                if (newPassword !== confirmPassword) {
                    passwordMessage.textContent =
                        "Las contraseñas nuevas no coinciden.";
                    return;
                }

                const button = document.getElementById(
                    "changePasswordButton"
                );

                button.disabled = true;
                passwordMessage.textContent = "";
                passwordMessage.classList.remove("success");

                try {
                    const credential =
                        EmailAuthProvider.credential(
                            user.email,
                            currentPassword
                        );

                    await reauthenticateWithCredential(
                        user,
                        credential
                    );

                    await updatePassword(
                        user,
                        newPassword
                    );

                    passwordForm.reset();

                    passwordMessage.textContent =
                        "Contraseña actualizada correctamente.";

                    passwordMessage.classList.add("success");

                } catch (error) {
                    console.error(
                        "Error al cambiar contraseña:",
                        error
                    );

                    passwordMessage.textContent =
                        error.code === "auth/invalid-credential"
                            ? "La contraseña actual es incorrecta."
                            : "No se pudo actualizar la contraseña. Intenta nuevamente.";

                } finally {
                    button.disabled = false;
                }
            }
        );

        logoutButton.addEventListener(
            "click",
            async () => {
                logoutButton.disabled = true;

                try {
                    await logout();
                } catch (error) {
                    console.error(error);
                    logoutButton.disabled = false;
                }
            }
        );

        document.getElementById(
            "retryButton"
        ).addEventListener("click", loadPanel);

        loadPanel();


const barberCalendarElement =
    document.getElementById("barberCalendar");

if (barberCalendarElement) {
    barberCalendarElement.addEventListener(
        "appointment:cancel",
        async event => {
            const appointment = event.detail?.appointment;

            if (!appointment?.id) {
                alert("No se pudo identificar la cita.");
                return;
            }

            const confirmed = window.confirm(
                `¿Cancelar la cita de ${appointment.clientName} ` +
                `del ${appointment.date} a las ${appointment.time}?`
            );

            if (!confirmed) {
                return;
            }

            try {
                await cancelAppointment(appointment.id);

                alert("La cita se canceló correctamente.");
            } catch (error) {
                console.error(
                    "Error al cancelar la cita:",
                    error
                );

                alert(
                    error.message ||
                    "No se pudo cancelar la cita."
                );
            }
        }
    );
}
    </script>
</body>
</html>
