
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1">
    <title>Verificar Firestore</title>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            background: #080808;
            color: #fff;
            font-family: Arial, sans-serif;
        }

        main {
            width: min(90%, 440px);
            padding: 28px;
            border: 1px solid #d7a65c;
            border-radius: 14px;
            background: #111;
        }

        h1 { color: #d7a65c; }

        pre {
            padding: 16px;
            background: #191919;
            border-radius: 8px;
            white-space: pre-wrap;
        }
    </style>
</head>
<body>
    <main>
        <h1>EDUARDO'S BARBERSHOP</h1>
        <p>Verificación de Firestore</p>
        <pre id="result">Consultando datos...</pre>
    </main>

    <script type="module">
        import {
            getCustomers,
            getBarbers,
            getServices,
            getAppointments
        } from "./js/firestore-storage.js";

        const result = document.getElementById("result");

        async function verify() {
            try {
                const [
                    customers,
                    barbers,
                    services,
                    appointments
                ] = await Promise.all([
                    getCustomers(),
                    getBarbers(),
                    getServices(),
                    getAppointments()
                ]);

                result.textContent = [
                    `Clientes: ${customers.length}`,
                    `Barberos: ${barbers.length}`,
                    `Servicios: ${services.length}`,
                    `Citas: ${appointments.length}`,
                    "",
                    "Consulta completada."
                ].join("\n");
            } catch (error) {
                console.error(error);

                result.textContent =
                    "Error: " + error.message;
            }
        }

        verify();
    </script>
</body>
</html>
